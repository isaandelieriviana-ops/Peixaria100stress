
{% extends "base.html" %}{% block content %}<section class="login-wrap"><form class="admin-form" method="post"><span class="eyebrow">CATÁLOGO</span><h1>{{'Editar produto' if p else 'Novo produto'}}</h1>
<label>Nome<input name="name" required value="{{p.name if p else ''}}"></label><label>Categoria<select name="category">{% for x in ['Peixes','Frutos do mar','Mercadinho','Combos'] %}<option {% if p and p.category==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>
<label>Descrição<textarea name="description">{{p.description if p else ''}}</textarea></label><div class="form-row"><label>Preço (R$)<input type="number" step="0.01" name="price" required value="{{p.price if p else '0'}}"></label><label>Preço promocional (opcional)<input type="number" step="0.01" name="promo_price" value="{{p.promo_price if p and p.promo_price else ''}}"></label></div>
<div class="form-row"><label>Unidade<select name="unit">{% for x in ['kg','unidade','bandeja','pacote','porção'] %}<option {% if p and p.unit==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Estoque<input type="number" step="0.01" name="stock" value="{{p.stock if p else 0}}"></label></div>
<div class="form-row"><label>Água<select name="water">{% for x in ['Água doce','Água salgada','Tanto faz'] %}<option {% if p and p.water==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Sabor<select name="flavor">{% for x in ['Suave','Intermediário','Marcante'] %}<option {% if p and p.flavor==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label></div>
<div class="form-row"><label>Textura<select name="texture">{% for x in ['Firme','Macia','Delicada'] %}<option {% if p and p.texture==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Espinhas<input name="bones" value="{{p.bones if p else 'Possui espinhas'}}"></label></div>
<label>Origem/procedência<input name="origin" value="{{p.origin if p else ''}}"></label><label>Melhor preparo<input name="preparation" value="{{p.preparation if p else ''}}"></label><label>URL de imagem (opcional)<input name="image" value="{{p.image if p else ''}}"></label><label class="check"><input type="checkbox" name="active" {% if not p or p.active %}checked{% endif %}> Produto ativo no site</label><button class="btn full">Salvar produto</button><a class="text-link" href="/admin">Voltar ao painel</a></form></section>{% endblock %}
